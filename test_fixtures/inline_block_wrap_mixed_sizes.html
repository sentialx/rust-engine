<!DOCTYPE html>
<html>
<head>
  <meta name="viewport-size" content="350x200">
  <style>
    body { margin: 0; }
    .container {
      display: block;
      width: 250px;
      background: #eeeeee;
      font-size: 0; /* Eliminate strut */
    }
    .small {
      display: inline-block;
      width: 40px;
      height: 25px;
      background: #cccccc;
      vertical-align: top;
    }
    .medium {
      display: inline-block;
      width: 70px;
      height: 35px;
      background: #aaaaaa;
      vertical-align: top;
    }
    .large {
      display: inline-block;
      width: 100px;
      height: 45px;
      background: #888888;
      vertical-align: top;
    }
  </style>
</head>
<body>
  <div class="container"><span class="small"></span><span class="medium"></span><span class="large"></span><span class="small"></span><span class="medium"></span></div>
</body>
</html>
