<!DOCTYPE html>
<html>
<head>
  <meta name="viewport-size" content="400x200">
  <style>
    body { margin: 0; }
    .container {
      display: block;
      background: #eeeeee;
      font-size: 0; /* Eliminate strut */
    }
    .outer {
      display: inline;
      /* No background - transparent wrapper */
    }
    .inner {
      display: inline;
      /* No background - transparent wrapper */
    }
    .item {
      display: inline-block;
      width: 30px;
      height: 20px;
      background: #666666;
      vertical-align: top;
    }
  </style>
</head>
<body>
  <div class="container"><span class="outer"><span class="item"></span><span class="inner"><span class="item"></span><span class="item"></span></span><span class="item"></span></span></div>
</body>
</html>
