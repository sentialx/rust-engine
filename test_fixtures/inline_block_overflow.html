<!DOCTYPE html>
<html>
<head>
  <meta name="viewport-size" content="300x150">
  <style>
    body { margin: 0; }
    .container {
      display: block;
      width: 80px;
      background: #eeeeee;
    }
    /* Item wider than container - should overflow, not wrap */
    .wide {
      display: inline-block;
      width: 120px;
      height: 30px;
      background: #cccccc;
    }
    .normal {
      display: inline-block;
      width: 40px;
      height: 25px;
      background: #aaaaaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="wide"></span>
    <span class="normal"></span>
  </div>
</body>
</html>
