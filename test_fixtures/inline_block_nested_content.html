<!DOCTYPE html>
<html>
<head>
  <meta name="viewport-size" content="400x250">
  <style>
    body { margin: 0; }
    .container {
      display: block;
      background: #eeeeee;
      font-size: 0; /* Eliminate strut */
    }
    .card {
      display: inline-block;
      width: 120px;
      background: #cccccc;
      padding: 10px;
      margin: 5px;
      vertical-align: top;
    }
    .header {
      display: block;
      height: 20px;
      background: #999999;
      margin-bottom: 5px;
    }
    .body {
      display: block;
      height: 40px;
      background: #bbbbbb;
    }
  </style>
</head>
<body>
  <div class="container"><div class="card"><div class="header"></div><div class="body"></div></div><div class="card"><div class="header"></div><div class="body"></div></div><div class="card"><div class="header"></div><div class="body"></div></div></div>
</body>
</html>
