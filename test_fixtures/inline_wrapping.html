<!DOCTYPE html>
<html>
<head>

  <style>
    body { margin: 8px; }
    .container {
      display: block;
      width: 200px;
      background: #eeeeee;
    }
    /* Use inline-block with explicit dimensions instead of pseudo-elements */
    .word {
      display: inline-block;
      width: 30px;
      height: 20px;
      background: #cccccc;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="word"></span>
    <span class="word"></span>
    <span class="word"></span>
    <span class="word"></span>
    <span class="word"></span>
  </div>
</body>
</html>
