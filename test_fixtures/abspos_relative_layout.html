<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport-size" content="300x200">
    <style>
      body {
        margin: 0px;
      }
      .rel-container {
        position: relative;
        margin-left: 8px;
        margin-top: 12px;
        padding: 10px;
        width: 120px;
        height: 80px;
        background: #e0e0e0;
      }
      .abs-box {
        position: absolute;
        left: 0px;
        top: 0px;
        width: 20px;
        height: 20px;
        background: #ff0000;
      }
      .static-box {
        width: 20px;
        height: 20px;
        background: #00aa00;
      }
      .rel-box {
        position: relative;
        left: 6px;
        top: 4px;
        width: 20px;
        height: 20px;
        margin-top: 8px;
        background: #0000ff;
      }
    </style>
  </head>
  <body>
    <div class="rel-container">
      <div class="abs-box"></div>
      <div class="static-box"></div>
      <div class="rel-box"></div>
    </div>
  </body>
</html>
