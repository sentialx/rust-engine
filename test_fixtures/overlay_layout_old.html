<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport-size" content="200x160">
    <style>
      body {
        position: relative;
      }
      .overlay-box {
        position: absolute;
        left: 0px;
        top: 0px;
        width: 30px;
        height: 20px;
        background: #ff0000;
      }
      .overlay-box-secondary {
        position: absolute;
        left: 40px;
        top: 10px;
        width: 20px;
        height: 14px;
        background: #0000ff;
      }
    </style>
  </head>
  <body>
    <div class="overlay-box"></div>
    <div class="overlay-box-secondary"></div>
  </body>
</html>
