<!DOCTYPE html>
<html>
<head>
  <meta name="viewport-size" content="300x150">
  <style>
    body { margin: 0; }
    .container {
      display: block;
      width: 199px;
      background: #eeeeee;
    }
    /* Two items that are 1px over container width - second should wrap */
    .item {
      display: inline-block;
      width: 100px;
      height: 30px;
      background: #cccccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="item"></span><span class="item"></span>
  </div>
</body>
</html>
