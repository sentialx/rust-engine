<!DOCTYPE html>
<html>
<head>
  <meta name="viewport-size" content="400x200">
  <style>
    body { margin: 0; }
    .container {
      display: block;
      background: #eeeeee;
      font-size: 0; /* Eliminate strut */
    }
    .ib-container {
      display: inline-block;
      width: 150px;
      background: #cccccc;
      padding: 5px;
      vertical-align: top;
      font-size: 0; /* Eliminate strut in nested container */
    }
    .inline-item {
      display: inline-block;
      width: 40px;
      height: 20px;
      background: #999999;
      margin: 2px;
      vertical-align: top;
    }
  </style>
</head>
<body>
  <div class="container"><div class="ib-container"><span class="inline-item"></span><span class="inline-item"></span><span class="inline-item"></span><span class="inline-item"></span></div><div class="ib-container"><span class="inline-item"></span><span class="inline-item"></span></div></div>
</body>
</html>
