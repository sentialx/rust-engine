<!DOCTYPE html>
<html>
<head>
  <meta name="viewport-size" content="400x200">
  <style>
    body { margin: 0; }
    .container {
      display: block;
      width: 300px;
      background: #eeeeee;
      font-size: 0; /* Eliminate strut */
    }
    .item {
      display: inline-block;
      width: 60px;
      height: 30px;
      background: #cccccc;
      vertical-align: top;
    }
    .padded {
      padding: 10px;
    }
    .padded-asymmetric {
      padding: 5px 15px 10px 20px;
    }
  </style>
</head>
<body>
  <div class="container"><span class="item"></span><span class="item padded"></span><span class="item padded-asymmetric"></span><span class="item"></span></div>
</body>
</html>
