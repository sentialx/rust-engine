<!DOCTYPE html>
<html>
<head>
  <meta name="viewport-size" content="600x500">
  <style>
    body { margin: 8px; }
    .outer {
      display: block;
      width: 300px;
      padding: 20px;
      background: #dddddd;
    }
    .middle {
      display: block;
      padding: 15px;
      margin: 10px 0;
      background: #bbbbbb;
    }
    .inner {
      display: block;
      width: 100px;
      height: 50px;
      margin: 5px;
      background: #999999;
    }
  </style>
</head>
<body>
  <div class="outer">
    <div class="middle">
      <div class="inner"></div>
      <div class="inner"></div>
    </div>
  </div>
</body>
</html>
