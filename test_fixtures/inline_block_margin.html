<!DOCTYPE html>
<html>
<head>
  <meta name="viewport-size" content="400x200">
  <style>
    body { margin: 0; }
    .container {
      display: block;
      background: #eeeeee;
      padding: 10px;
    }
    .item {
      display: inline-block;
      width: 50px;
      height: 30px;
      background: #cccccc;
    }
    .margin-right { margin-right: 20px; }
    .margin-left { margin-left: 15px; }
    .margin-both { margin: 0 10px; }
  </style>
</head>
<body>
  <div class="container">
    <span class="item margin-right"></span>
    <span class="item margin-both"></span>
    <span class="item margin-left"></span>
  </div>
</body>
</html>
