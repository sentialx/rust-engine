<!DOCTYPE html>
<html>
<head>
  <meta name="viewport-size" content="500x400">
  <style>
    body { margin: 8px; }
    .layout {
      display: block;
      width: 400px;
      background: #f0f0f0;
    }
    .sidebar {
      display: inline-block;
      width: 100px;
      height: 200px;
      background: #cccccc;
      vertical-align: top;
    }
    .content {
      display: inline-block;
      width: 280px;
      height: 200px;
      background: #aaaaaa;
      vertical-align: top;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="sidebar"></div>
    <div class="content"></div>
  </div>
</body>
</html>
